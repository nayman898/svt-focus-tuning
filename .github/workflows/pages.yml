name: Deploy Calibration Reference to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "reports/calibration-inventory/**"
      - "docs/**"
      - "tunes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p _site/reports
          touch _site/.nojekyll
          cp index.html _site/index.html
          cp -r reports/calibration-inventory _site/reports/calibration-inventory
          cp -r docs _site/docs
          cp -r tunes _site/tunes

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
